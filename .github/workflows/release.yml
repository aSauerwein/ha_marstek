name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip distribution
        run: |
          cd "${{ github.workspace }}"
          zip -r hacs.zip \
            custom_components/ \
            hacs.json \
            info.md \
            --exclude "*.git/*"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: hacs.zip
